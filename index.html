<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>creando un login</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <header class="header">
    <nav class="navbar">
        <a href="#">home</a>
        <a href="#">about</a>
        <a href="#">services</a>
        <a href="#">contact</a>
    </nav>
    <form action="#" class="search-bar">
        <input type="text " placeholder="search...">
        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        
    </form>
    </header>
    <div class="background"></div>
    <div class="container">
        <div class="content">
            <h2 class="logo"><i class="fa-solid fa-fire"></i>
            login</h2>
            <div class="text-sci">
                <h2>welcome! <br> <span>¡es tu oportunidad de viajar!</span></h2>
                <p>es una oportunidad de viajar a nueva zelanda y vivir tranquiamente</p>
                <div class="social-icons">
                    <a href="#"><i class="fa-solid fa-link"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                </div>

            </div>

        </div>
        <div class="logreg-box">
            <div class="form-box login">
                <form action="#">
                    <h2>sign in</h2>
                    <div class="input-box">
                        <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" required>
                        <label>email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" required>
                        <label>password</label>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox">remember me</label>
                        <a href="#">forgot password?</a>
                    </div>
                  <button type="submit" class="btn">sign in</button>
                    <div class="login-reginter">
                        <p>don't have an account? <a href="#" class="register-link">sign up</a></p>
                    </div>
                </form>
            </div>
             
                        <div class="form-box register">
                <form action="#">
                    <h2>sign up</h2>
                    <div class="input-box">
                        <span class="icon"><i class="fa-solid fa-user"></i></span>
                        <input type="text" required>
                        <label>name</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" required>
                        <label>email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" required>
                        <label>password</label>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox">i gree to the terms & conditions </label>
                       
                    </div>
                 <button type="submit" class="btn">sign up</button>
                    <div class="login-reginter">
                        <p>already have an account? <a href="#" class="login-link">sign up</a></p>
                    </div>
                </form>
            </div>





        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
